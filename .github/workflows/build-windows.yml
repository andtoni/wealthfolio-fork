name: Build Windows Installer

# On-demand Windows build for testing branches. Produces the NSIS installer
# as a workflow artifact — no tag, no GitHub release.
#
# Manual only: run it from Actions → "Build Windows Installer" → "Run workflow"
# and pick the branch to build from the ref dropdown. This requires the file to
# be present on the default branch (workflow_dispatch is only exposed once it
# lands on main).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Windows target"
        type: choice
        default: aarch64-pc-windows-msvc
        options:
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    env:
      TARGET: ${{ inputs.target || 'aarch64-pc-windows-msvc' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Rust setup
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install Rust target
        run: rustup target add ${{ env.TARGET }}

      - name: pnpm Setup
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          # Reuse the caches warmed on main by cache-warm.yml.
          shared-key:
            release-${{ env.TARGET == 'aarch64-pc-windows-msvc' && 'windows-aarch64' ||
            'windows-x86_64' }}
          save-if: false

      - name: Sync node version and setup cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app (no release)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_API_URL: ${{ vars.CONNECT_API_URL }}
          CONNECT_OAUTH_CALLBACK_URL: ${{ vars.CONNECT_OAUTH_CALLBACK_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          args: --target ${{ env.TARGET }} --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wealthfolio-${{ env.TARGET }}-nsis
          path: target/${{ env.TARGET }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
