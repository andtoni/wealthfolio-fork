[package]
name = "wealthfolio-app"
version.workspace = true
edition.workspace = true
description = "Portfolio tracker"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/wealthfolio/wealthfolio"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Internal crates
wealthfolio-market-data = { workspace = true }
wealthfolio-core = { workspace = true }
wealthfolio-connect = { workspace = true }
wealthfolio-storage-sqlite = { workspace = true }
wealthfolio-device-sync = { workspace = true }
wealthfolio-ai = { workspace = true }
wealthfolio-spending = { workspace = true }
wealthfolio-agent-tools = { workspace = true }

# Tauri
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-log = "=2.8.0"
tauri-plugin-deep-link = "=2.4.9"

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["time", "net"] }
uuid = { workspace = true }
anyhow = { workspace = true }
diesel = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

# Additional dependencies
dotenvy = "=0.15.7"
keyring = "=2.3.3"
local-ip-address = "=0.6.13"
hostname = "=0.3.1"
base64 = "=0.22.1"
urlencoding = "=2.1.3"

# Embedded MCP server
subtle = "=2.6.1"
tokio-util = "=0.7.18"

# Crypto
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = ["connect-sync", "device-sync"]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
appstore = [] # Feature flag for App Store builds
connect-sync = []
device-sync = []

[lib]
name = "wealthfolio_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "=2.4.1"
tauri-plugin-single-instance = { version = "=2.4.2", features = ["deep-link"] }

# Embedded MCP server (desktop-only; mobile builds exclude it)
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
rmcp = { workspace = true }
wealthfolio-mcp = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "=2.3.2"
# Using git version for iOS camera view fix (PR #2440)
tauri-plugin-barcode-scanner = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-web-auth = "=1.0.0"
tauri-plugin-mobile-share = "=0.1.2"
