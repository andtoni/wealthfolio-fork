[package]
name = "wealthfolio-server"
version.workspace = true
edition.workspace = true

[dependencies]
# Internal crates
wealthfolio-market-data = { workspace = true }
wealthfolio-core = { workspace = true }
wealthfolio-connect = { workspace = true }
wealthfolio-storage-sqlite = { workspace = true }
wealthfolio-device-sync = { workspace = true }
wealthfolio-ai = { workspace = true }
wealthfolio-spending = { workspace = true }
wealthfolio-agent-tools = { workspace = true }
wealthfolio-mcp = { workspace = true }

# Web framework
axum = { version = "=0.8.9", features = ["json", "macros", "multipart"] }
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["cors", "trace", "compression-full", "timeout", "request-id", "fs"] }

# Workspace dependencies
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
async-trait = { workspace = true }

uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }

# Additional dependencies
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter", "json"] }
dotenvy = "=0.15.7"
utoipa = { version = "=4.2.3", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "=4.0.0", features = ["axum"] }
serde_with = "=3.21.0"
serde_urlencoded = "=0.7.1"
base64 = "=0.21.7"
argon2 = { version = "=0.5.3", features = ["std"] }
jsonwebtoken = { version = "=10.4.0", features = ["aws_lc_rs"] }
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
hkdf = "=0.12.4"
sha2 = "=0.10.9"
rand = "=0.8.6"
urlencoding = "=2.1.3"
tower_governor = "=0.8.0"
tokio-stream = { version = "=0.1.18", features = ["sync"] }
futures = "=0.3.32"
futures-core = "=0.3.32"
semver = "=1.0.28"
hyper = { version = "=0.14.32", features = ["full"] }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rmcp = { workspace = true }
subtle = "=2.6.1"
rusqlite = { workspace = true }

[features]
default = ["connect-sync", "device-sync"]
connect-sync = []
device-sync = []

[dev-dependencies]
reqwest = { workspace = true }
tempfile = "=3.27.0"
