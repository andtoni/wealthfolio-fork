[package]
name = "wealthfolio-core"
version.workspace = true
edition.workspace = true
description = "An Open Source Desktop Portfolio tracker"
authors = ["Aziz Fadil"]
license = "AGPL-3.0"
repository = "https://github.com/wealthfolio/wealthfolio"

[features]
default = []

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
diesel = { workspace = true }
diesel_migrations = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
num-traits = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }

# Sibling crates
wealthfolio-market-data = { path = "../market-data" }

# Additional dependencies not in workspace
yahoo_finance_api = "=4.1.0"
regex = "=1.12.3"
rand = { workspace = true }
rand_distr = "=0.4.3"
rayon = "=1.12.0"
dashmap = "=6.2.1"
serde_with = "=3.21.0"
urlencoding = "=2.1.3"
csv = "=1.4.0"
chardetng = "=0.1.17"
encoding_rs = "=0.8.35"
zip = "=2.4.2"
jsonpath-rust = "=0.7.5"
scraper = "=0.22.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
chrono-tz = "=0.10.4"
url = "=2.5.8"

[dev-dependencies]
tempfile = "=3.27.0"
proptest = "=1.11.0"
