[package]
name = "wealthfolio-market-data"
version.workspace = true
edition = "2021"

[dependencies]
async-trait = "=0.1.89"
chrono = { version = "=0.4.45", features = ["serde"] }
log = "=0.4.32"
num-traits = "=0.2.19"
reqwest = { workspace = true }
rust_decimal = { version = "=1.42.0", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
time = "=0.3.47"
tokio = { version = "=1.52.3", features = ["sync", "time"] }
tracing = "=0.1.44"
urlencoding = "=2.1.3"
yahoo_finance_api = "=4.1.0"
lazy_static = "=1.5.0"

[dev-dependencies]
rust_decimal_macros = "=1.40.0"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros"] }
